site_name: FIALNA-Tapeout Docs
site_url: https://das-dias.github.io/fialna_chip_webdocs/ # Critical for deployment
theme:
  name: shadcn
  show_title: true # show the title in the top bar
  show_stargazers: true # show the stargazers in the top bar
  pygments_style: # default styles 
        light: shadcn-light
        dark: github-dark
  icon: heroicons:cpu-chip # use the shadcn svg if not defined
  topbar_sections: true
  katex_options: # optional
    macros: # example of macros
      "\\RR": "\\mathbb{R}" 
      "\\dx": "\\mathrm{d}x"
  show_datetime: false 
  accent: "oklch(64.5% 0.246 16.439)" # NEW!

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - js/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - FIALNA Tapeout Docs: index.md
  - Controller Interface: interface.md
  - Command Line Interface: cli.md
  - Contributing: contributing.md